  <line x1="24" y1="264" x2="456" y2="264" stroke="#21262D" stroke-width="1" />

  <text x="24" y="288" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">
    Baseline snapshot · Replaced automatically once METRICS_TOKEN is active
  </text>
