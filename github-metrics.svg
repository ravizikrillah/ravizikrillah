<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-label="GitHub Metrics for Ravizikrillah">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
  </defs>

  <rect width="480" height="310" rx="12" fill="url(#mBg)" stroke="#30363D" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(24, 34)">
    <circle cx="8" cy="-5" r="5" fill="#38BDF8" />
    <text x="22" y="0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
      Ravizikrillah · GitHub Overview
    </text>
    <text x="0" y="22" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
      RAVI BANGKIT NUR ZIKRILLAH
    </text>
  </g>

  <line x1="24" y1="72" x2="456" y2="72" stroke="#21262D" stroke-width="1" />

  <!-- Key Metrics Boxes -->
  <g transform="translate(24, 90)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="134" height="68" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />
    <text x="16" y="26" fill="#8B949E" font-size="11.5" font-weight="500">Public Repos</text>
    <text x="16" y="52" fill="#58A6FF" font-size="22" font-weight="700">12</text>

    <rect x="149" y="0" width="134" height="68" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />
    <text x="165" y="26" fill="#8B949E" font-size="11.5" font-weight="500">Stars Earned</text>
    <text x="165" y="52" fill="#E3B341" font-size="22" font-weight="700">29</text>

    <rect x="298" y="0" width="134" height="68" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />
    <text x="314" y="26" fill="#8B949E" font-size="11.5" font-weight="500">Total Forks</text>
    <text x="314" y="52" fill="#3FB950" font-size="22" font-weight="700">6</text>
  </g>

  <!-- Language Distribution Bar (Grounded in public repo primary languages) -->
  <g transform="translate(24, 184)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" fill="#C9D1D9" font-size="13" font-weight="600">Primary Repository Languages</text>

    <!-- Multi-segment bar (total width 432: JS 60% = 259, Kotlin 20% = 86, Go 10% = 43, HTML 10% = 44) -->
    <g transform="translate(0, 14)">
      <rect x="0" y="0" width="259" height="10" rx="4" fill="#F1E05A" />
      <rect x="261" y="0" width="85" height="10" fill="#A97BFF" />
      <rect x="348" y="0" width="41" height="10" fill="#00ADD8" />
      <rect x="391" y="0" width="41" height="10" rx="4" fill="#E34C26" />
    </g>

    <!-- Legend -->
    <g transform="translate(0, 44)" font-size="12" fill="#8B949E">
      <circle cx="6" cy="-4" r="5" fill="#F1E05A" />
      <text x="16" y="0" fill="#C9D1D9">JavaScript</text>
      <text x="80" y="0">60%</text>

      <circle cx="126" cy="-4" r="5" fill="#A97BFF" />
      <text x="136" y="0" fill="#C9D1D9">Kotlin</text>
      <text x="176" y="0">20%</text>

      <circle cx="222" cy="-4" r="5" fill="#00ADD8" />
      <text x="232" y="0" fill="#C9D1D9">Go</text>
      <text x="254" y="0">10%</text>

      <circle cx="300" cy="-4" r="5" fill="#E34C26" />
      <text x="310" y="0" fill="#C9D1D9">HTML</text>
      <text x="350" y="0">10%</text>
    </g>
